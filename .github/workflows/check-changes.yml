name: Check school timetable changes

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check school website
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from pathlib import Path
          import json
          import re

          URL = "https://www.elejasvsk.lv/dokumenti/izmainas.html"

          request = Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urlopen(request, timeout=30) as response:
              raw = response.read()

          if raw.startswith((b"\xff\xfe", b"\xfe\xff")):
              html = raw.decode("utf-16")
          elif raw.count(b"\x00") > len(raw) // 4:
              html = raw.decode("utf-16-le")
          else:
              html = raw.decode("utf-8", errors="replace")

          class AnnouncementParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.capture = False
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "noscript", "head"):
                      self.skip += 1
                  elif tag == "body":
                      self.skip = 0
                  elif tag in ("h1", "h2", "h3", "p", "li"):
                      self.capture = True
                      self.parts.append(" ")

              def handle_endtag(self, tag):
                  if tag in ("script", "style", "noscript", "head") and self.skip:
                      self.skip -= 1
                  elif tag in ("h1", "h2", "h3", "p", "li"):
                      self.capture = False
                      self.parts.append(" ")

              def handle_data(self, data):
                  if self.capture and not self.skip:
                      value = data.strip()
                      if value:
                          self.parts.append(value)

          parser = AnnouncementParser()
          parser.feed(html)

          text = re.sub(
              r"\s+", " ", " ".join(parser.parts)
          ).strip()

          if not text:
              raise RuntimeError("No announcement text found.")

          data = {
              "source": URL,
              "announcement": text
          }

          content = json.dumps(
              data, ensure_ascii=False, indent=2
          ) + "\n"

          path = Path("changes.json")

          if not path.exists() or path.read_text(encoding="utf-8") != content:
              path.write_text(content, encoding="utf-8")
              print("Announcement file updated:", text)
          else:
              print("No announcement changes detected.")
          PY

      - name: Save changes if updated
        run: |
          git add changes.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update school timetable announcements"
            git push
          else
            echo "No announcement changes to save."
          fi

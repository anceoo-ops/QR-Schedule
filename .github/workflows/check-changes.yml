name: Check school timetable changes

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check school website
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from pathlib import Path
          import json
          import re

          URL = "https://www.elejasvsk.lv/dokumenti/izmainas.html"

          class AnnouncementParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.capture = False
                  self.skip = False

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "head"):
                      self.skip = True
                  if tag == "body":
                      self.skip = False
                  if tag in ("h3", "p"):
                      self.capture = True
                      self.parts.append(" ")

              def handle_endtag(self, tag):
                  if tag in ("script", "style", "head"):
                      self.skip = False
                  if tag in ("h3", "p"):
                      self.capture = False
                      self.parts.append(" ")

              def handle_data(self, data):
                  if self.capture and not self.skip:
                      text = data.strip()
                      if text:
                          self.parts.append(text)

          request = Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")

          parser = AnnouncementParser()
          parser.feed(html)

          announcement = re.sub(
              r"\s+", " ", " ".join(parser.parts)
          ).strip()

          if not announcement:
              raise RuntimeError("No announcement text found.")

          data = {
              "source": URL,
              "announcement": announcement
          }

          content = json.dumps(
              data, ensure_ascii=False, indent=2
          ) + "\n"

          Path("changes.json").write_text(
              content, encoding="utf-8"
          )
          PY

      - name: Save changes if updated
        run: |
          git add changes.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update school timetable announcements"
            git push
          else
            echo "No announcement changes to save."
          fi
